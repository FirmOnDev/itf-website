<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodPicker ITF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf3e4;
      --ink: #2b1d14;
      --chili: #d8392b;
      --chili-dark: #a82a1f;
      --leaf: #2f5d3a;
      --card: #fffdf8;
      --line: #e6d7bd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Sarabun", sans-serif;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 14px 24px;
      background: var(--leaf);
      color: #fff;
      font-size: 14px;
    }
    .navbar .title {
      font-family: "Mitr", sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
    }
    .navbar .week { text-align: right; }

    /* Main */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }
    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      background: #f3e6cc;
    }
    .card h2 {
      margin-top: 18px;
      font-family: "Mitr", sans-serif;
      font-weight: 500;
      font-size: 28px;
      color: var(--chili);
    }
    .card p {
      margin-top: 6px;
      color: #6b5848;
      line-height: 1.5;
    }
    .price {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #fde1da;
      color: var(--chili-dark);
      font-weight: 600;
    }
    .card.pop { animation: pop 0.25s ease; }
    @keyframes pop {
      from { transform: scale(0.96); opacity: 0.6; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Button */
    .pick-btn {
      width: 100%;
      max-width: 360px;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background: var(--chili);
      color: #fff;
      font-family: "Mitr", sans-serif;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--chili-dark);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .pick-btn:hover { background: #e24434; }
    .pick-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--chili-dark);
    }
    .pick-btn:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .card.pop { animation: none; }
    }
  </style>
</head>
<body>

  <!-- 1. Navbar -->
  <nav class="navbar">
    <span>69070020</span>
    <span class="title">FOODPICKER ITF</span>
    <span class="week">Week15</span>
  </nav>

  <main>
    <!-- 2. ส่วนแสดงข้อมูลอาหาร -->
    <section class="card" id="card">
      <img id="food-img" src="" alt="">
      <h2 id="food-name"></h2>
      <p id="food-desc"></p>
      <span class="price" id="food-price"></span>
    </section>

    <!-- 3. ปุ่มสุ่ม -->
    <button class="pick-btn" id="pick-btn">สุ่มเมนูอาหาร</button>
  </main>

  <script>
    // 4. รายการอาหาร (มากกว่า 5 รายการ)
    var foods = [
      {
        name: "ข้าวมันไก่",
        desc: "น้ำซุปใสๆ น้ำจิ้มรสเด็ด หอมมันนุ่ม",
        price: "ราคา 50-65 บาท",
        image: "ข้าวมันไก่.jpg"
      },
      {
        name: "ผัดกะเพราหมูสับไข่ดาว",
        desc: "เผ็ดจัดจ้าน หอมใบกะเพรา ไข่ดาวกรอบๆ",
        price: "ราคา 50-60 บาท",
        image: "ผัดกะเพราหมูสับไข่ดาว.jpg"
      },
      {
        name: "ก๋วยเตี๋ยวเรือ",
        desc: "น้ำซุปเข้มข้น เส้นเหนียวนุ่ม ชามเล็กกินได้หลายชาม",
        price: "ราคา 15-20 บาท/ชาม",
        image: "ก๋วยเตี๋ยวเรือ.jpg"
      },
      {
        name: "ส้มตำไทย",
        desc: "เปรี้ยว หวาน เค็ม เผ็ด ครบรส กินคู่ไก่ย่าง",
        price: "ราคา 40-60 บาท",
        image: "ส้มตำไทย.jpg"
      },
      {
        name: "ข้าวขาหมู",
        desc: "ขาหมูพะโล้เปื่อยนุ่ม ราดน้ำพะโล้หอมๆ ไข่ต้มครึ่งฟอง",
        price: "ราคา 55-70 บาท",
        image: "ข้าวขาหมู.jpg"
      },
      {
        name: "ผัดไทยกุ้งสด",
        desc: "เส้นจันท์ผัดซอสมะขาม โรยถั่วป่น เสิร์ฟพร้อมถั่วงอก",
        price: "ราคา 60-80 บาท",
        image: "ผัดไทยกุ้ง.jpg"
      }
    ];

    var card = document.getElementById("card");
    var foodImg = document.getElementById("food-img");
    var foodName = document.getElementById("food-name");
    var foodDesc = document.getElementById("food-desc");
    var foodPrice = document.getElementById("food-price");
    var pickBtn = document.getElementById("pick-btn");

    var lastIndex = -1;

    function showFood(index) {
      var food = foods[index];
      foodImg.src = food.image;
      foodImg.alt = food.name;
      foodName.textContent = food.name;
      foodDesc.textContent = food.desc;
      foodPrice.textContent = food.price;

      // เล่นแอนิเมชันทุกครั้งที่สุ่ม
      card.classList.remove("pop");
      void card.offsetWidth;
      card.classList.add("pop");
    }

    function pickRandom() {
      var index = Math.floor(Math.random() * foods.length);
      // สุ่มให้ไม่ซ้ำเมนูเดิม
      while (index === lastIndex) {
        index = Math.floor(Math.random() * foods.length);
      }
      lastIndex = index;
      showFood(index);
    }

    pickBtn.addEventListener("click", pickRandom);
    pickRandom(); // แสดงเมนูแรกตอนโหลดหน้า
  </script>
</body>
</html>
